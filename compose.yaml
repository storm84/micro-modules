services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: micro_modules
      POSTGRES_USER: micro_modules
      POSTGRES_PASSWORD: micro_modules_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - poc-postgres:/var/lib/postgresql
      - ./samples/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micro_modules -d micro_modules"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  poc-postgres:
